<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<h2>로그인</h2>

<form id="loginForm">
  <!-- 아이디 칸은 휴대폰 자판이 첫 글자를 대문자로 바꾸지 않게 한다. 가입 규칙이 소문자만 받는다 -->
  <label for="username">ID :</label><br>
  <input type="text" name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false"><br><br>

  <label for="password">비밀번호 :</label><br>
  <input type="password" name="password" id="password" autocomplete="current-password"><br><br>

  <button type="submit" id="loginSubmit">로그인</button>
</form>

<script>
  

  document.getElementById("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (!username || !password) {
      showToast("아이디와 비밀번호를 모두 입력해주세요.", 'error');
      return;
    }

    // 응답이 오기 전에 다시 누르면 요청이 두 번 나간다. 실패했을 때만 다시 누를 수 있게 한다
    const submitBtn = document.getElementById("loginSubmit");
    submitBtn.disabled = true;

    fetch("/api/users/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ username, password })
    })
            .then(async response => {
              const data = await response.json();

              if (response.ok) {
                toastAfterReload(data.message);
                window.location.href = "/";
              } else {
                showToast(data.message || "로그인에 실패했습니다.", 'error');
                submitBtn.disabled = false;
              }
            })
            .catch(error => {
              console.error("로그인 요청 실패:", error);
              showToast("서버 오류로 로그인에 실패했습니다.", 'error');
              submitBtn.disabled = false;
            });
  });
</script>

</body>
</html>
