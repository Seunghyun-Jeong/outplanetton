<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="feed-container" style="margin-top: 30px;">
    <h2 style="margin-bottom: 4px;">
        <span th:text="${targetUsername}">username</span> 님의 콘텐츠
    </h2>
    <p class="text-subtle" style="font-size: 14px; margin-bottom: 8px;">
        정지 사유 확인용 — 관리자만 볼 수 있는 페이지입니다.
    </p>

    <!--
      상자와 글자 모양은 신고 상세 화면의 한 줄(.admin-list-item.report-row)을 같이 쓴다.
      피드 카드(.post-summary)는 사진이 꽉 차게 안쪽 여백이 0이라 글만 있는 이 화면에서는 글자가 상자 끝에 붙었다.
      날짜는 정지 근거를 보는 화면이라 상대 시간이 아니라 정지 유저 목록과 같은 절대 시각으로 찍는다.
    -->
    <h3 style="margin-top: 20px;">작성한 글</h3>
    <div class="text-subtle" th:if="${posts.isEmpty()}" style="padding: 20px 0;">작성한 글이 없습니다.</div>
    <div th:each="post : ${posts}" class="admin-list-item report-row">
        <div class="report-row-main">
            <span class="report-sub" th:if="${post.updatedAt == null}"
                  th:text="'작성일 ' + ${T(com.example.sns.util.DateTimeDisplay).minutes(post.createdAt)}"></span>
            <span class="report-sub" th:if="${post.updatedAt != null}"
                  th:text="'수정일 ' + ${T(com.example.sns.util.DateTimeDisplay).minutes(post.updatedAt)} + ' (수정됨)'"></span>
            <div class="report-detail-text" th:text="${post.content}">내용</div>
            <div class="report-sub">
                좋아요 <span th:text="${post.likeCount}">0</span>, 댓글 <span th:text="${post.commentCount}">0</span>
            </div>
        </div>
    </div>

    <h3 style="margin-top: 32px;">작성한 댓글</h3>
    <div class="text-subtle" th:if="${comments.isEmpty()}" style="padding: 20px 0;">작성한 댓글이 없습니다.</div>
    <div th:each="comment : ${comments}" class="admin-list-item report-row">
        <div class="report-row-main">
            <span class="report-sub"
                  th:text="'작성일 ' + ${T(com.example.sns.util.DateTimeDisplay).minutes(comment.createdAt)}"></span>
            <div class="report-detail-text" th:text="${comment.content}">댓글 내용</div>
            <div class="admin-quote">
                원문 글 (<span th:text="${comment.postAuthor}">작성자</span>):
                <span th:text="${comment.postContent}">글 내용</span>
            </div>
        </div>
    </div>
</div>



</body>
</html>
