<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<h2>회원가입</h2>

<form id="signupForm">
    <!-- 아이디 칸은 휴대폰 자판이 첫 글자를 대문자로 바꾸지 않게 한다. 가입 규칙이 소문자만 받는다 -->
    <label for="username">ID :</label><br>
    <input type="text" name="username" id="username" autocomplete="username" autocapitalize="none" spellcheck="false"><br><br>

    <label for="password">비밀번호 :</label><br>
    <input type="password" name="password" id="password" autocomplete="new-password"><br><br>

    <label for="passwordConfirm">비밀번호 확인 :</label><br>
    <input type="password" id="passwordConfirm" autocomplete="new-password"><br><br>

    <button type="submit" id="signupSubmit">가입하기</button>
</form>

<script>
    

    function validateForm() {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const passwordConfirm = document.getElementById("passwordConfirm").value;

        const usernameRegex = /^(?![0-9]+$)(?!.*[_.]{2})(?!^[._])(?!.*[._]$)[a-z0-9._]{4,10}$/;
        if (!usernameRegex.test(username)) {
            showToast("아이디는 4자 이상 10자 이하, 소문자와 숫자만 포함되며, 숫자만 사용하거나 .과 _를 제외한 특수문자 사용은 불가능합니다.", 'error');
            return false;
        }

        const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*()_+]).{8,15}$/;
        if (!passwordRegex.test(password)) {
            showToast("비밀번호에 알파벳 대문자, 소문자, 숫자, 특수문자를 반드시 포함해야 합니다.", 'error');
            return false;
        }

        if (password !== passwordConfirm) {
            showToast("비밀번호가 일치하지 않습니다.", 'error');
            return false;
        }

        return true;
    }

    document.getElementById("signupForm").addEventListener("submit", function (e) {
        e.preventDefault();

        if (!validateForm()) return;

        const formData = new FormData(document.getElementById("signupForm"));

        // 응답이 오기 전에 다시 누르면 요청이 두 번 나간다. 실패했을 때만 다시 누를 수 있게 한다
        const submitBtn = document.getElementById("signupSubmit");
        submitBtn.disabled = true;

        fetch("/api/users/signup", {
            method: "POST",
            body: formData
        })
            .then(async response => {
                const data = await response.json();

                if (response.ok) {
                    toastAfterReload(data.message);
                    if (data.redirectUrl) {
                        window.location.href = data.redirectUrl;
                    }
                } else {
                    showToast(data.message || "회원가입에 실패했습니다.", 'error');
                    submitBtn.disabled = false;
                }
            })
            .catch(error => {
                console.error("회원가입 요청 실패:", error);
                showToast("서버 오류로 회원가입에 실패했습니다.", 'error');
                submitBtn.disabled = false;
            });
    });
</script>

</body>
</html>
